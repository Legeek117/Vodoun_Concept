<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond noir -->
  <rect width="64" height="64" rx="14" fill="#1A1410"/>
  <!-- Vévé simplifié — croix + losange + point central — couleur or Vodun -->
  <!-- Croix cardinale -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cercle extérieur -->
  <circle cx="32" cy="32" r="22" stroke="#B8860B" stroke-width="1.2" fill="none" opacity="0.8"/>
  <!-- Cercle intérieur -->
  <circle cx="32" cy="32" r="12" stroke="#B8860B" stroke-width="0.9" fill="none" opacity="0.6"/>
  <!-- Losange -->
  <polygon points="32,14 46,32 32,50 18,32"
    stroke="#B8860B" stroke-width="1.3" fill="none" opacity="0.9"/>
  <!-- Point central lumineux -->
  <circle cx="32" cy="32" r="3" fill="#D2B98E"/>
  <!-- Points cardinaux -->
  <circle cx="32" cy="10" r="1.5" fill="#B8860B" opacity="0.85"/>
  <circle cx="32" cy="54" r="1.5" fill="#B8860B" opacity="0.85"/>
  <circle cx="10" cy="32" r="1.5" fill="#B8860B" opacity="0.85"/>
  <circle cx="54" cy="32" r="1.5" fill="#B8860B" opacity="0.85"/>
</svg>
